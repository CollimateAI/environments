id: swe-flask
name: SWE - pallets/flask @ 3.1.3
description: pallets/flask frozen at 3.1.3 with test deps installed and the full pytest suite green at build; grade patches by running pytest.
image: ghcr.io/collimateai/env-swe-flask
tags:
  - swe
  - rl
  - python
  - pytest
  - exec-grader
probe: bash -lc "cd /repo && git rev-parse HEAD && python -m pytest tests/test_config.py -q"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: python -c "import flask" && python -m pytest --collect-only -q >/dev/null
