id: swe-fastapi
name: SWE - fastapi/fastapi @ 0.139.0
description: fastapi/fastapi frozen at 0.139.0 with [all] extras and the tests dependency group installed, full suite green at build; grade patches by running pytest.
image: ghcr.io/collimateai/env-swe-fastapi
tags:
  - swe
  - rl
  - python
  - pytest
  - exec-grader
probe: bash -lc "cd /repo && git rev-parse HEAD && python -m pytest tests/test_path.py -q -p no:sugar"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: python -c "import fastapi" && python -m pytest --collect-only -q -p no:sugar >/dev/null
