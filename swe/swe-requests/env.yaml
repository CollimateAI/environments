id: swe-requests
name: SWE - psf/requests @ v2.34.2
description: psf/requests frozen at v2.34.2 with dev deps installed and the full pytest suite green at build; grade patches by running pytest (fully offline).
image: ghcr.io/collimateai/env-swe-requests
tags:
  - swe
  - rl
  - python
  - pytest
  - exec-grader
probe: bash -lc "cd /repo && git rev-parse HEAD && python -m pytest tests/test_structures.py -q"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: python -c "import requests" && python -m pytest --collect-only -q >/dev/null
