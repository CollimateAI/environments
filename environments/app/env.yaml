id: app
name: Live app server (HTTP + WebSocket)
description: A minimal HTTP + WebSocket app server, warmed and left running, reachable over host→guest ingress — the reference connect-from-outside environment for previews, OpenEnv env-servers, and remote tool/model servers.
image: us-central1-docker.pkg.dev/collimateai/collimate-environments/env-app
tags:
  - app
  - http
  - websocket
  - openenv
  - preview
# The app listens on 0.0.0.0:8000 (HTTP /health + /json, WebSocket /ws echo).
# It binds 0.0.0.0 directly, so the exposed port is reachable with no relay —
# the common case for an HTTP/WS service. Reach it from the client with
# sb.port_forward(8000) or client.connect_url(id, 8000).
service_port: 8000
probe: python -c "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)) or True; print('ok')"
ready:
  # Live-service ready state: start the app server and LEAVE IT RUNNING, captured
  # in the snapshot so every fork wakes with it already serving. Declares the
  # port so host→guest ingress DNATs it into each fork's netns.
  cmd: /usr/local/bin/collimate-warm
  exposePorts: [8000]
