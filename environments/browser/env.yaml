id: browser
name: Browser (Playwright + Chromium)
description: Playwright for Python with headless Chromium installed, for browser agents and web automation.
image: ghcr.io/collimateai/env-browser
tags:
  - browser
  - playwright
  - chromium
  - python
  - web-agent
probe: python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop(); print('ok')"
