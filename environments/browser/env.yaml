id: browser
name: Browser (Playwright + Chromium)
description: Playwright for Python with headless Chromium installed, for browser agents and web automation.
image: ghcr.io/collimateai/env-browser
tags:
  - browser
  - playwright
  - chromium
  - python
  - web-agent
probe: python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop(); print('ok')"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()"
