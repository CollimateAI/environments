id: browser
name: Browser (Playwright + Chromium)
description: Headless Chromium + Playwright, warmed with a live CDP endpoint — fork it for browser-agent and web-navigation RL rollouts.
image: us-central1-docker.pkg.dev/collimateai/collimate-environments/env-browser
tags:
  - browser
  - playwright
  - chromium
  - python
  - web-agent
# The CDP endpoint the baked live browser listens on; a rollout attaches via
# playwright connect_over_cdp("http://127.0.0.1:9222") in milliseconds.
cdp_endpoint: http://127.0.0.1:9222
probe: python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.connect_over_cdp('http://127.0.0.1:9222'); b.close(); p.stop(); print('ok')"
ready:
  # Live-service ready state: launch Chromium and LEAVE IT RUNNING with CDP on
  # :9222, captured in the snapshot so every fork wakes with a live browser — a
  # rollout attaches in ms, no per-fork launch. See docs/cookbook/live-browser.md.
  cmd: /usr/local/bin/collimate-warm
