id: pytorch-cpu
name: PyTorch (CPU)
description: PyTorch CPU build with Transformers and Datasets for inference, eval harnesses, and data prep.
image: ghcr.io/collimateai/env-pytorch-cpu
tags:
  - python
  - pytorch
  - transformers
  - cpu
  - eval
probe: python -c "import torch, transformers, datasets; print(torch.__version__)"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: python -c "import torch, transformers, datasets; torch.zeros(1)"
