id: datasci-notebook
name: Data Science Notebook
description: Python with a Jupyter kernel (exec-driven, no server), DuckDB, Polars, and PyArrow for dataframe and SQL-on-files work.
image: ghcr.io/collimateai/env-datasci-notebook
tags:
  - python
  - jupyter
  - duckdb
  - polars
  - data
probe: python -c "import duckdb, polars, pyarrow, ipykernel; print(duckdb.sql('SELECT 1').fetchone())"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: python -c "import duckdb, polars, pyarrow, ipykernel"
