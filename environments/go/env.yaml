id: go
name: Go
description: Go 1.23 with golangci-lint for building, testing, and lint-gating Go code.
image: ghcr.io/collimateai/env-go
tags:
  - go
  - golangci-lint
  - coding-agent
probe: bash -lc "go version && golangci-lint --version"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: go version && golangci-lint --version
