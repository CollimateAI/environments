id: node
name: Node.js + TypeScript
description: Node 22 with pnpm, TypeScript, and Vitest for JS/TS coding agents and test-driven codegen.
image: ghcr.io/collimateai/env-node
tags:
  - node
  - typescript
  - javascript
  - vitest
  - coding-agent
probe: bash -lc "node --version && tsc --version && vitest --version && pnpm --version"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: node -e "require('typescript'); require('vitest/package.json')"
