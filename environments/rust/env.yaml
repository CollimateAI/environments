id: rust
name: Rust
description: Rust 1.79 with common native build deps and cargo-nextest for compile-and-test workloads.
image: ghcr.io/collimateai/env-rust
tags:
  - rust
  - cargo
  - nextest
  - coding-agent
probe: bash -lc "rustc --version && cargo nextest --version"
ready:
  # Run once when Collimate bakes this image into a warm artifact; every fork
  # inherits the result. This is what makes a fresh sandbox interactive
  # instantly: imports resolved, caches hot, nothing left to warm up.
  cmd: rustc --version && cargo --version && cargo nextest --version
